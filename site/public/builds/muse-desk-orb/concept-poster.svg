<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Muse desk orb concept</title>
  <desc id="desc">A round screen in a desk stand, with labels for push-to-talk, text replies and images.</desc>
  <defs>
    <radialGradient id="screen" cx="42%" cy="32%" r="75%">
      <stop offset="0" stop-color="#b9a7ff"/>
      <stop offset="0.55" stop-color="#5f46d8"/>
      <stop offset="1" stop-color="#1c143f"/>
    </radialGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edf0f5"/>
      <stop offset="1" stop-color="#8e98a8"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#090b12"/>
  <circle cx="786" cy="333" r="245" fill="#523fd0" opacity=".18" filter="url(#shadow)"/>
  <text x="78" y="82" fill="#8bf2c3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">HACKSHOP BUILD 001</text>
  <text x="78" y="158" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">A desk orb for Muse</text>
  <text x="78" y="210" fill="#aeb7c7" font-family="Arial, Helvetica, sans-serif" font-size="25">Give an agent a microphone, touch input and a round display.</text>
  <g transform="translate(790 330)">
    <ellipse cx="0" cy="230" rx="220" ry="34" fill="#000" opacity=".45"/>
    <path d="M-160 205 L-113 80 Q-100 50 -72 50 H72 Q100 50 113 80 L160 205 Z" fill="url(#stand)"/>
    <rect x="-178" y="184" width="356" height="50" rx="24" fill="#6f7888"/>
    <circle cx="0" cy="0" r="174" fill="#b5bbc5"/>
    <circle cx="0" cy="0" r="158" fill="#10121a"/>
    <circle cx="0" cy="0" r="148" fill="url(#screen)"/>
    <circle cx="-45" cy="-16" r="12" fill="#fff"/>
    <circle cx="45" cy="-16" r="12" fill="#fff"/>
    <path d="M-48 45 Q0 79 48 45" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <rect x="168" y="-70" width="14" height="38" rx="7" fill="#8bf2c3"/>
    <rect x="168" y="8" width="14" height="38" rx="7" fill="#70798a"/>
    <rect x="-27" y="167" width="54" height="12" rx="6" fill="#222733"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="78" y="304" width="375" height="66" rx="18" fill="#151925" stroke="#323b4e"/>
    <circle cx="112" cy="337" r="11" fill="#8bf2c3"/>
    <text x="138" y="346" fill="#fff" font-size="24">Hold the top button to talk</text>
    <rect x="78" y="390" width="375" height="66" rx="18" fill="#151925" stroke="#323b4e"/>
    <circle cx="112" cy="423" r="11" fill="#b9a7ff"/>
    <text x="138" y="432" fill="#fff" font-size="24">Read replies on the display</text>
    <rect x="78" y="476" width="375" height="66" rx="18" fill="#151925" stroke="#323b4e"/>
    <circle cx="112" cy="509" r="11" fill="#ffca79"/>
    <text x="138" y="518" fill="#fff" font-size="24">View images Muse sends</text>
    <text x="78" y="642" fill="#ffca79" font-size="21" font-weight="700">CONCEPT ANIMATION · NOT YET PHYSICALLY BUILT BY HACKSHOP</text>
  </g>
</svg>
