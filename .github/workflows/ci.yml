name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: discovery_test_only
          POSTGRES_DB: discovery_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISCOVERY_TEST_DATABASE_URL: postgresql://postgres:discovery_test_only@127.0.0.1:55437/discovery_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Several root-level tests render website components. Install the site's
      # React/Next dependency tree before running those tests in CI.
      - run: npm ci --prefix site

      - name: Validate catalog and tags (boot-time gate)
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: TypeScript build
        run: npm run build

      - name: Website build and published-data mirror gate
        run: npm run build --prefix site

      - name: Run regression suite (catalog/example consistency only)
        run: npm run regress
